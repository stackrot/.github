# Mentions the maintainer when an agent labels an issue or PR
# needs-approval. Agents post as the maintainer, and GitHub doesn't notify
# anyone about their own comments, so this posts as github-actions[bot].
# Each repo calls this from its own notify.yml.
name: Notify

on:
  workflow_call:
    inputs:
      user:
        description: Who to mention
        type: string
        default: stackrot

permissions: {}

jobs:
  mention:
    if: ${{ github.event.label.name == 'needs-approval' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Ask for approval
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          MENTION: ${{ inputs.user }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" --silent \
            -f body="@$MENTION an agent is waiting for your approval here. Read its comment above, then add the \`approved\` label to let it carry on, or close this."
