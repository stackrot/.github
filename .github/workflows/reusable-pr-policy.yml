# Fails a pull request that doesn't close an issue or lacks the AI
# disclosure that CONTRIBUTING.md asks for. Each repo calls this from its
# own pr-policy.yml.
name: PR policy

on:
  workflow_call:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the linked issue and AI disclosure
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          case $AUTHOR in
          dependabot\[bot\] | renovate\[bot\])
            echo "Dependency update from $AUTHOR: nothing to check."
            exit 0
            ;;
          esac

          # Drop HTML comments so the template's hints don't count, and the
          # carriage returns that PRs written in the browser carry.
          body=$(printf '%s' "$BODY" | tr -d '\r' | perl -0pe 's/<!--.*?-->//gs')
          status=0

          issue='\b(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+([[:alnum:]_.-]+/[[:alnum:]_.-]+)?#[0-9]+'
          if ! grep -qiE "$issue" <<<"$body"; then
            echo "::error::The description must close an issue, e.g. 'Closes #12'."
            status=1
          fi

          if grep -qiE '^[[:space:]]*AI assistance:[[:space:]]*none[[:space:]]*$' <<<"$body"; then
            exit $status
          fi
          for key in Model Effort Harness; do
            if ! grep -qiE "^[[:space:]]*AI-$key:[[:space:]]*[^[:space:]]" <<<"$body"; then
              echo "::error::'AI-$key:' is missing or empty. Fill in the AI disclosure, or write 'AI assistance: none'."
              status=1
            fi
          done
          exit $status
