# Runs the official code-review plugin on a pull request and posts its
# findings as inline review threads. Each repo calls this from its own
# claude-review.yml.
#
# The plugin reviews a PR once. Later runs see Claude's earlier comment and
# stop early, so commits pushed after the review aren't reviewed again.
name: Claude review

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label for the review job
        type: string
        default: ubuntu-latest
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions: {}

jobs:
  review:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Check for the review token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [[ -z $TOKEN ]]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN isn't set. Run 'scripts/baseline secret' from stackrot/.github."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: code-review@claude-plugins-official
          prompt: /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          claude_args: --allowedTools "mcp__github_inline_comment__create_inline_comment"

      # The action skips Claude, and still passes, when a PR changes the
      # calling workflow, so that no PR can run an edited copy with the
      # secret. Only that PR may pass without a review.
      - name: Fail unless the review ran
        if: ${{ success() && steps.claude.outputs.conclusion != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          workflow=${WORKFLOW_REF#"$GITHUB_REPOSITORY/"}
          workflow=${workflow%%@*}
          if gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
              --jq '.[].filename' | grep -qxF "$workflow"; then
            echo "::warning::This PR changes $workflow, so Claude can't review it. Review it with /code-review instead."
            exit 0
          fi
          echo "::error::The Claude review didn't run. See the step above for why."
          exit 1
