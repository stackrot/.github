# Runs the official code-review plugin on a pull request and posts its
# findings as inline review threads. Each repo calls this from its own
# claude-review.yml.
#
# Each PR is reviewed once. Later runs find Claude's earlier comment and
# skip the review, so commits pushed after it aren't reviewed again.
name: Claude review

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label for the review job
        type: string
        default: ubuntu-latest
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions: {}

jobs:
  review:
    # Bots can't trigger the action, and fork PRs get no secrets, so the
    # maintainer reviews those by hand.
    if: >-
      ${{ !github.event.pull_request.draft
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && github.event.pull_request.user.login != 'renovate[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      # The action refuses to run, so that no PR can run an edited copy with
      # the secret, when a PR changes the calling workflow. Only those PRs
      # pass without a review.
      - name: Check whether the PR changes the review workflow
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          caller=${WORKFLOW_REF#"$GITHUB_REPOSITORY/"}
          caller=${caller%%@*}
          changed=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --paginate --jq '.[].filename' |
            grep -xF -e "$caller" \
              -e .github/workflows/reusable-claude-review.yml || true)
          if [[ -n $changed ]]; then
            echo "::warning::This PR changes ${changed//$'\n'/, }, so Claude can't review it. Review it with /code-review instead."
            echo "skip=true" >>"$GITHUB_OUTPUT"
          fi

      # The plugin's own step 1 asks a Haiku agent whether Claude has already
      # commented, and it often counts an agent-written PR's description as
      # that and stops without posting. Decide it here instead. Only the
      # review's own comments count, as the @claude workflow posts as
      # claude[bot] too; they all end with the footer the prompt asks for.
      - name: Check whether Claude has already reviewed the PR
        id: reviewed
        if: ${{ steps.scope.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          count=0
          for kind in issues pulls; do
            n=$(gh api "repos/$GITHUB_REPOSITORY/$kind/$PR/comments" \
              --paginate --jq '[.[] | select(.user.login == "claude[bot]" and (.body | contains("running the code-review plugin")))] | length' |
              awk '{s += $1} END {print s + 0}')
            count=$((count + n))
          done
          if ((count > 0)); then
            echo "Claude has already reviewed this PR."
            echo "done=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Check for the review token
        if: ${{ steps.scope.outputs.skip != 'true' && steps.reviewed.outputs.done != 'true' }}
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [[ -z $TOKEN ]]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN isn't set. Run 'scripts/baseline secret' from stackrot/.github."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.scope.outputs.skip != 'true' && steps.reviewed.outputs.done != 'true' }}
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        id: claude
        if: ${{ steps.scope.outputs.skip != 'true' && steps.reviewed.outputs.done != 'true' }}
        # The plugin starts its four reviewers as background agents, and the
        # SDK run can end while they're still going, so nothing is posted.
        # With background tasks off they run in the foreground and finish.
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: code-review@claude-plugins-official
          # The workflow has already done the plugin's step 1 checks, so the
          # prompt says to skip it.
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Skip step 1. This workflow has already checked that the pull request is open, isn't a draft and has no comment from Claude, so start at step 2. Every pull request here needs a review, however small, and whether a person or an AI agent wrote it. Run every agent in the foreground and wait for all of them before you post and finish.
          # Pinned so the disclosure below stays accurate. The plugin runs
          # its own Sonnet and Haiku subagents for parts of the review.
          claude_args: |
            --model claude-opus-5-5
            --effort high
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "Review every open pull request that isn't a draft, including small ones and ones written by AI agents on stackrot's behalf: don't stop because a change looks automated or trivial. If you find no issues, still post the summary comment. End every comment you post, inline comments included, with these four lines, each on its own line: (1) _Posted by an AI agent on stackrot's behalf, not by stackrot._ (2) AI-Model: Claude Opus 5.5 (claude-opus-5-5), with Claude Sonnet and Haiku subagents (3) AI-Effort: high (4) AI-Harness: Claude Code GitHub Action (anthropics/claude-code-action v1.0.290) running the code-review plugin."

      # The action also returns early and passes when its token exchange is
      # refused, which would look like a clean review.
      - name: Fail unless the review ran
        if: ${{ success() && steps.scope.outputs.skip != 'true' && steps.reviewed.outputs.done != 'true' && steps.claude.outputs.conclusion != 'success' }}
        run: |
          echo "::error::The Claude review didn't run. See the step above for why."
          exit 1

      # The plugin can also stop early without saying anything. A review
      # counts only once Claude has commented on the PR, in this run or an
      # earlier one.
      - name: Fail unless Claude has posted a review
        if: ${{ success() && steps.scope.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          count=0
          for kind in issues pulls; do
            n=$(gh api "repos/$GITHUB_REPOSITORY/$kind/$PR/comments" \
              --paginate --jq '[.[] | select(.user.login == "claude[bot]" and (.body | contains("running the code-review plugin")))] | length' |
              awk '{s += $1} END {print s + 0}')
            count=$((count + n))
          done
          if ((count == 0)); then
            echo "::error::Claude finished without posting a review on this PR. Re-run this job, or review it with /code-review."
            exit 1
          fi
